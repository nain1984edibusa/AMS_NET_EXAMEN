global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'otel-collector-spanmetrics'
    static_configs:
      - targets: ['jaeger:8889']
        labels:
          instance: 'otel-spanmetrics'
          

  - job_name: 'erueka.server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['eureka.server:8761']
  - job_name: 'config.server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config.server:8889']
  - job_name: 'gateway'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['gateway:8080'] 
  
  

  - job_name: 'payments.service'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['payments.service:8080'] 
  - job_name: 'policies.search.service'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['policies.search.service:8080'] 
  - job_name: 'policies.service'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['policies.service:8080'] 
  - job_name: 'pricing.service'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['pricing.service:8080'] 
  - job_name: 'products.service'
    metrics_path: /healthmetrics
    static_configs:
      - targets: ['products.service:8080']
      
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - "alertmanager:9093"