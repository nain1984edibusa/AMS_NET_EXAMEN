server:
  port: 8889
spring:
  application:
    name: Config-Server
  cloud:    
    config:
      server:
        git:
          uri: https://github.com/Claud-Native-Academy/Config-Server-Repository-202504.git
          search-paths:
            - '{application}'
          defaultLabel: master
eureka:
  instance:
    appName: Config-Server    
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/