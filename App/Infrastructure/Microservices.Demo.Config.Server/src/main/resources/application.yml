server:
  port: 8889
spring:
  application:
    name: Config.Server
  cloud:    
    config:
      server:
        git:
          uri: https://github.com/nain1984edibusa/Config-Server-Repository-202504.git
          search-paths:
            - '{application}'
          defaultLabel: main
eureka:
  instance:    
    # hostname: localhost # Uncomment if you want to set a specific hostname
    appName: Config.Server
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    prometheus:
      enabled: true      
  metrics:
    enable:
      all: true    
    export:
      prometheus:
        enabled: true